<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CardPerks - Smart Wallet Deal Matcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">CardPerks Engine</h1>
        <p class="text-sm text-slate-400">Zero-PCI Household Card Deal Optimizer</p>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-xs text-slate-400">Simulate Day:</label>
        <select id="dayFilter" onchange="loadMatchedOffers()" class="bg-slate-800 border border-slate-700 text-sm rounded px-2 py-1">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5" selected>Friday (Weekend Alert)</option>
          <option value="6">Saturday</option>
        </select>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <section class="lg:col-span-1 bg-slate-800/60 p-5 rounded-xl border border-slate-700">
        <h2 class="text-lg font-semibold mb-4 text-slate-200">Household Wallet</h2>
        <form id="addCardForm" onsubmit="handleAddCard(event)" class="space-y-3 mb-6 bg-slate-900/80 p-3 rounded-lg border border-slate-800">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Select Card</label>
            <select id="cardSelect" required class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm"></select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Holder</label>
              <select id="cardHolder" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm">
                <option value="Self">Self</option>
                <option value="Spouse">Spouse</option>
                <option value="Family">Family</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Nickname (Opt)</label>
              <input type="text" id="nickname" placeholder="e.g. Salary" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm">
            </div>
          </div>
          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-1.5 rounded text-sm transition">
            + Add to Wallet
          </button>
        </form>
        <div id="walletList" class="space-y-2"></div>
      </section>

      <section class="lg:col-span-2">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold text-slate-200">Active Unlocked Offers</h2>
          <span id="dealCount" class="text-xs bg-slate-800 border border-slate-700 px-2 py-1 rounded text-slate-400">0 Offers</span>
        </div>
        <div id="offersList" class="space-y-3"></div>
      </section>
    </div>
  </div>

  <script>
    const USER_ID = 1;

    async function init() {
      await loadMasterCards();
      await loadWallet();
      await loadMatchedOffers();
    }

    async function loadMasterCards() {
      const res = await fetch('/api/cards/master');
      const cards = await res.json();
      const select = document.getElementById('cardSelect');
      select.innerHTML = cards.map(c => 
        `<option value="${c.id}">${c.bank_name} - ${c.card_name} (${c.card_type})</option>`
      ).join('');
    }

    async function loadWallet() {
      const res = await fetch(`/api/wallet/${USER_ID}`);
      const cards = await res.json();
      const list = document.getElementById('walletList');
      if (cards.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500">No cards added yet. Add your cards above.</p>`;
        return;
      }
      list.innerHTML = cards.map(c => `
        <div class="flex justify-between items-center bg-slate-800/90 border border-slate-700 px-3 py-2 rounded text-sm">
          <div>
            <div class="font-medium text-slate-200">${c.bank_name} ${c.card_name}</div>
            <div class="text-xs text-emerald-400 font-mono">${c.cardholder_label} ${c.custom_nickname ? '• ' + c.custom_nickname : ''} (${c.card_type})</div>
          </div>
          <button onclick="deleteCard(${c.id})" class="text-slate-500 hover:text-red-400 text-xs">✕</button>
        </div>
      `).join('');
    }

    async function handleAddCard(e) {
      e.preventDefault();
      const masterCardId = document.getElementById('cardSelect').value;
      const cardholderLabel = document.getElementById('cardHolder').value;
      const customNickname = document.getElementById('nickname').value;

      await fetch(`/api/wallet/${USER_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ masterCardId, cardholderLabel, customNickname })
      });
      document.getElementById('nickname').value = '';
      await loadWallet();
      await loadMatchedOffers();
    }

    async function deleteCard(cardId) {
      await fetch(`/api/wallet/${cardId}`, { method: 'DELETE' });
      await loadWallet();
      await loadMatchedOffers();
    }

    async function loadMatchedOffers() {
      const day = document.getElementById('dayFilter').value;
      const res = await fetch(`/api/offers/matched/${USER_ID}?day=${day}`);
      const offers = await res.json();
      
      document.getElementById('dealCount').textContent = `${offers.length} Offers Available`;
      const container = document.getElementById('offersList');
      
      if (offers.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-800 rounded-lg p-6 text-center text-slate-500">
            No active perks found for your registered cards on this selected day.
          </div>`;
        return;
      }

      container.innerHTML = offers.map(o => `
        <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-4 hover:border-slate-600 transition">
          <div class="flex justify-between items-start gap-4">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-950 border border-emerald-800 text-emerald-400">
                  ${o.merchant_name}
                </span>
                <span class="text-xs text-slate-400">• ${o.category}</span>
              </div>
              <h3 class="text-base font-semibold text-slate-100">${o.offer_headline}</h3>
              <p class="text-xs text-slate-400 mt-1">Min Spend: ₹${o.min_spend} ${o.max_discount ? '| Max Cap: ₹' + o.max_discount : ''}</p>
            </div>
            ${o.coupon_code ? `
              <div class="text-right">
                <span class="text-xs text-slate-400 block mb-0.5">Code</span>
                <code class="bg-slate-900 border border-slate-700 text-emerald-300 font-mono text-xs px-2 py-1 rounded select-all font-semibold">
                  ${o.coupon_code}
                </code>
              </div>
            ` : ''}
          </div>
          <div class="mt-3 pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs text-slate-400">
            <span>Unlocked by: <strong class="text-slate-200">${o.bank_name} ${o.card_name}</strong></span>
            <span class="bg-slate-900 px-2 py-0.5 rounded border border-slate-800 text-emerald-400">
              ${o.cardholder_label}'s Card
            </span>
          </div>
        </div>
      `).join('');
    }

    init();
  </script>
</body>
</html>
