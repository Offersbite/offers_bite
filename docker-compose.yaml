version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cardperks_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cardperks
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: cardperks_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/cardperks
      - PORT=3000
    depends_on:
      - postgres

volumes:
  pgdata:
